name: CI - Build, Test & Validate

on:
  push:
    branches: [ main, master, 'part3/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.sln

    - name: Build
      run: dotnet build RaceDay.sln --no-restore --configuration Release

    - name: Run Jarred's Unit Tests
      run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal

    - name: Build Part 3 MVC project
      run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

    - name: Build Part 3 Docker image
      run: docker build -t raceday-web ./RaceDay.Web

    - name: Validate Part 1 docs folder exists
      run: |
        if [ -d "docs" ]; then
          echo "✅ docs folder exists"
        else
          echo "❌ docs folder missing"
          exit 1
        fi

    - name: Final Status
      run: echo "🎉 Build + Tests passed! Green build ✅"